name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (CPU-only torch; no GPU/UAVDT/YOLO/NLP-weight-download steps here)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,onnx,anomaly,dataviz]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy src

      - name: pytest
        run: pytest -v
