[project]
name = "infrastructure-overwatch"
version = "0.1.0"
description = "A defensive, analyst-in-the-loop computer-vision pipeline for critical-infrastructure corridor monitoring."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10.0",
    "opencv-python>=4.9",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "torchvision>=0.17",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]
anomaly = ["scikit-image>=0.22"]
dataviz = ["matplotlib>=3.8", "seaborn>=0.13", "plotly>=5.20", "kaleido>=0.2"]
nlp = ["transformers>=4.40", "peft>=0.10", "datasets>=2.19"]
notebooks = ["jupyter>=1.0", "matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
]

[project.scripts]
infrastructure-overwatch = "infrastructure_overwatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infrastructure_overwatch"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py312"
# Evidence notebooks are demonstrative code that imports and exercises src/ --
# src/ carries the lint bar, not the notebooks. Mirrors the mypy exclude below.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["^notebooks/"]
